<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Open Source Accessibility Framework</title>
    <script>
      // GitHub Pages has no server-side routing, so deep links to Vue Router
      // paths 404. Redirect to the app root with the original path preserved
      // in the query string, and main.ts restores it via history.replaceState.
      var path = location.pathname.slice(1);
      location.replace('/?redirect=' + encodeURIComponent(path) + location.search + location.hash);
    </script>
  </head>
  <body></body>
</html>
