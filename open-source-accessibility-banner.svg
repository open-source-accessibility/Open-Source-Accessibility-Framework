  <text x="232" y="91" fill="#F4C95D" class="eyebrow">OPEN SOURCE ACCESSIBILITY</text>
  <text x="78" y="272" fill="#fff" font-size="76" font-weight="780" letter-spacing="-2.5">Open Source</text>
  <text x="78" y="348" fill="url(#gold)" font-size="76" font-weight="780" letter-spacing="-2.5">Accessibility</text>
  <text x="82" y="405" fill="#EEF0F2" font-size="25" font-weight="520">Making open source software more accessible—together.</text>
  <rect x="82" y="448" width="550" height="2" fill="#F4C95D"/>
  <text x="82" y="502" fill="#F4C95D" font-size="19" font-weight="700">Connect. Contribute. Make progress visible.</text>
  <text x="82" y="540" fill="#AEB4BA" class="body">A community, a roadmap, and a practical framework</text>
  <text x="82" y="568" fill="#AEB4BA" class="body">for sustained accessibility progress.</text>

  <g transform="translate(82 633)">
