---
name: "Open Source Accessibility Framework project registration"
description: Sign up a project to participate in the Open Source Accessibility Framework.
# IMPORTANT: Do not add or change labels when creating an issue from this form.
# Adding your own labels can break the workflow action trigger that runs follow-up automation.
title: "[Open Source Accessibility Framework] <project name>"
labels:
  - registered
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your interest in the [Open Source Accessibility Framework](https://open-source-accessibility.github.io/Open-Source-Accessibility-Framework/).

        This framework uses a public accountability model, not private certification. Your project's tracking issue and accessibility progress will be publicly visible.

  - type: input
    id: project-name
    attributes:
      label: "Project name"
      description: "What is the name of the project signing up for the framework?"
      placeholder: "Example: Accessible component library"
    validations:
      required: true

  - type: input
    id: project-repository
    attributes:
      label: "Project repository"
      description: "Provide the URL of the project's source code repository."
      placeholder: "https://github.com/organization/repository"
    validations:
      required: true

  - type: input
    id: project-url
    attributes:
      label: "Project URL"
      description: "If applicable, provide the URL of the live product or project website."
      placeholder: "https://example.com"
    validations:
      required: false

  - type: input
    id: maintainer-poc
    attributes:
      label: "Maintainer / contributor point of contact"
      description: "Provide the GitHub handle of each maintainer or contributor who will be a point of contact."
      placeholder: "@username or @username1 @username2"
    validations:
      required: true
