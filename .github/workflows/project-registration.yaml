name: Welcome new project registration

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to comment on.'
        required: true
        default: '1'

permissions:
  issues: write
  contents: read

jobs:
  welcome-comment:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[Open Source Accessibility Framework]') }}
    steps:
      - name: Get project name and build badge
        id: project
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let issue;
            if (context.eventName === 'workflow_dispatch') {
              const issueNumber = Number(context.payload.inputs?.issue_number || '1');
              const response = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              issue = response.data;
            } else {
              issue = context.payload.issue;
            }

            const body = issue.body || '';

            function getFieldValue(label) {
              const match = body.match(new RegExp(`###\\s*${label}\\s*\\n+([\\s\\S]*?)(?=\\n###\\s*|\\n*$)`, 'i'));
              if (!match) return '';
              return match[1].trim().replace(/\r/g, '').replace(/\n+/g, ' ').trim();
            }

            const projectName = getFieldValue('Project name') || 'Project';
            const issueUrl = issue.html_url;

            const safeName = encodeURIComponent(projectName).replace(/%20/g, '%20');
            const badgeUrl = `https://img.shields.io/badge/Open%20Source%20Accessibility%20Framework-${safeName}-C20F7B?logo=github`;

            core.setOutput('project_name', projectName);
            core.setOutput('issue_url', issueUrl);
            core.setOutput('badge_url', badgeUrl);
            core.setOutput('badge_markdown', `[![OSAF: ${projectName}](${badgeUrl})](${issueUrl})`);

      - name: Comment on the tracking issue
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let issue;
            if (context.eventName === 'workflow_dispatch') {
              const issueNumber = Number(context.payload.inputs?.issue_number || '1');
              const response = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              issue = response.data;
            } else {
              issue = context.payload.issue;
            }

            const projectName = '${{ steps.project.outputs.project_name }}';
            const issueUrl = '${{ steps.project.outputs.issue_url }}';
            const badgeMarkdown = '${{ steps.project.outputs.badge_markdown }}';

            const comment = [
              'Your project is officially registered with the Open Source Accessibility Framework. We\'re so happy you joined us.',
              '',
              'This issue will be used to track your progress and public accountability commitments. Please feel free to add this badge in your project repo to let others know about your progress:',
              '',
              badgeMarkdown,
              '',
              'You can also share this issue with your community to show your accessibility roadmap and updates.'
            ].join('\n\n').trim();

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment
            });