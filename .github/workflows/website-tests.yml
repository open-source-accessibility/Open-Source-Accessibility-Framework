name: Website tests

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-tests.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit -- --run
