name: Welcome new project registration

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to comment on.'
        required: true
        default: '1'

permissions:
  issues: write
  contents: read

jobs:
  welcome-comment:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[Open Source Accessibility Framework]') }}
    steps:
      - name: Get project name and build badge
        id: project
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let issue;
            if (context.eventName === 'workflow_dispatch') {
              const issueNumber = Number(context.payload.inputs?.issue_number || '1');
              const response = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              issue = response.data;
            } else {
              issue = context.payload.issue;
            }

            const body = issue.body || '';

            function getFieldValue(label) {
              const match = body.match(new RegExp(`###\\s*${label}\\s*\\n+([\\s\\S]*?)(?=\\n###\\s*|\\n*$)`, 'i'));
              if (!match) return '';
              return match[1].trim().replace(/\r/g, '').replace(/\n+/g, ' ').trim();
            }

            const projectName = getFieldValue('Project name') || 'Project';
            const maintainerPoc = getFieldValue('Maintainer point of contact') || '@maintainer';
            const issueUrl = issue.html_url;
            const participationHeading = '### Accessibility framework participation';
            const participationMessage = [
              participationHeading,
              'This project participates in the [Open Source Accessibility Framework](https://github.com/open-source-accessibility/Open-Source-Accessibility-Framework), demonstrating its commitment to ongoing accessibility improvement.',
              'This tracking issue documents the project’s progress as it adopts the framework and provides a public record of its accessibility commitments, completed work, and next steps.',
              'To follow the progress of other participating projects, visit the [Open Source Accessibility Framework registered projects board](https://github.com/orgs/open-source-accessibility/projects/1).'
            ].join('\n\n');

            if (!body.includes(participationHeading)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `${participationMessage}\n\n---\n\n${body}`
              });
            }

            const safeName = encodeURIComponent(projectName).replace(/%20/g, '%20');
            const badgeUrl = `https://img.shields.io/badge/Accessibility%20Framework-${safeName}-F143AB?logo=github&logoColor=000000`;

            core.setOutput('project_name', projectName);
            core.setOutput('maintainer_poc', maintainerPoc);
            core.setOutput('issue_url', issueUrl);
            core.setOutput('badge_url', badgeUrl);
            core.setOutput('badge_markdown', `[![OSAF: ${projectName}](${badgeUrl})](${issueUrl})`);

      - name: Comment on the tracking issue
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let issue;
            if (context.eventName === 'workflow_dispatch') {
              const issueNumber = Number(context.payload.inputs?.issue_number || '1');
              const response = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              issue = response.data;
            } else {
              issue = context.payload.issue;
            }

            const maintainerPoc = '${{ steps.project.outputs.maintainer_poc }}';
            const badgeMarkdown = '${{ steps.project.outputs.badge_markdown }}';
            const mention = maintainerPoc.startsWith('@') ? maintainerPoc : `@${maintainerPoc}`;

            const comment = [
              `${mention}, your project is officially registered with the [Open Source Accessibility Framework](https://github.com/open-source-accessibility/Open-Source-Accessibility-Framework). We're so happy you joined us.`,
              'This issue will be used to track your progress and public accountability commitments. Please feel free to add this badge in your project repo to let others know about your progress:',
              badgeMarkdown,
              [
                'Please refer to the phase documentation for next steps:',
                '* **[Foundational phase](https://github.com/open-source-accessibility/Open-Source-Accessibility-Framework/blob/main/framework/phases/foundational-phase.md):** make accessibility visible and create a clear reporting path',
                '* **[Workflow phase](https://github.com/open-source-accessibility/Open-Source-Accessibility-Framework/blob/main/framework/phases/workflow-phase.md):** integrate accessibility into issues, pull requests, and contribution practices',
                '* **[Testing phase](https://github.com/open-source-accessibility/Open-Source-Accessibility-Framework/blob/main/framework/phases/testing-phase.md):** add automated and manual testing practices',
                '* **[Community phase](https://github.com/open-source-accessibility/Open-Source-Accessibility-Framework/blob/main/framework/phases/community-phase.md):** improve responsiveness, documentation, and contributor participation'
              ].join('\n')
            ].join('\n\n').trim();

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment
            });