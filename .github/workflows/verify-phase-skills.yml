name: Verify phase skills

on:
  pull_request:
    paths:
      - 'framework/phases/**'
      - 'framework/ai/skills/**'
      - 'scripts/generate-phase-skills.mjs'
      - '.github/workflows/verify-phase-skills.yml'
  push:
    branches: [main]
    paths:
      - 'framework/phases/**'
      - 'framework/ai/skills/**'
      - 'scripts/generate-phase-skills.mjs'
      - '.github/workflows/verify-phase-skills.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify portable phase skills
        run: node scripts/generate-phase-skills.mjs --check
